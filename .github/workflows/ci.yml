name: Rounders
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Simulation and cross-process replay
        run: ./scripts/test.sh
      - name: iPhone simulator build
        run: >-
          xcodebuild -project Rounders.xcodeproj -scheme Rounders
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/rounders-simulator" build
      - name: iPhone architecture without signing
        run: >-
          xcodebuild -project Rounders.xcodeproj -scheme Rounders -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/rounders-device"
          CODE_SIGNING_ALLOWED=NO build
